[package]
name = "t3-code"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
avif-rust = "0.3"
base64 = "0.22"
fontique = "0.12"
image = { version = "0.25", default-features = false, features = [
  "bmp",
  "gif",
  "ico",
  "jpeg",
  "png",
  "tiff",
  "webp",
] }
pulldown-cmark = { version = "0.13", default-features = false }
regex = { version = "1", default-features = false, features = ["std", "unicode-gencat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }
rune = { git = "https://github.com/voltcrash/rune", rev = "edf85cc3f2ff593d204433ffd10f3b2f0ef05adb", features = [
  "native-file-dialog",
] }
rune-kit = { git = "https://github.com/voltcrash/rune", rev = "edf85cc3f2ff593d204433ffd10f3b2f0ef05adb", features = [
  "markdown",
] }
cubeb = { version = "0.38", features = ["no-private-apis-in-coreaudio"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSBundle",
  "NSEnumerator",
  "NSString",
  "NSValue",
] }
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
blake3 = "1"
close_fds = "0.3"
x11rb = { version = "0.13.2", features = ["cursor", "xinput"] }

[target.'cfg(windows)'.dependencies]
ctrlc = "3.5"
winsafe = { version = "0.0.29", features = ["kernel"] }

# Cargo applies Rune's platform patches only from the root manifest.
[patch.crates-io]
accesskit_macos = { git = "https://github.com/voltcrash/rune", rev = "edf85cc3f2ff593d204433ffd10f3b2f0ef05adb" }
accesskit_windows = { git = "https://github.com/voltcrash/rune", rev = "edf85cc3f2ff593d204433ffd10f3b2f0ef05adb" }
parley_engine = { git = "https://github.com/voltcrash/rune", rev = "edf85cc3f2ff593d204433ffd10f3b2f0ef05adb" }
sctk-adwaita = { git = "https://github.com/voltcrash/rune", rev = "edf85cc3f2ff593d204433ffd10f3b2f0ef05adb" }
wgpu-hal = { git = "https://github.com/voltcrash/rune", rev = "edf85cc3f2ff593d204433ffd10f3b2f0ef05adb" }
winit = { git = "https://github.com/voltcrash/rune", rev = "edf85cc3f2ff593d204433ffd10f3b2f0ef05adb" }
